<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>회원가입</title>
</head>

<body>

    <h2>회원가입</h2>

    <form th:action="@{/user/signup}"
          th:object="${signupRequest}"
          method="post">

        <input type="hidden"
               th:name="${_csrf.parameterName}"
               th:value="${_csrf.token}">

        <div>
            <label>아이디</label>
            <input type="text"
                   th:field="*{username}"
                   required>
            <p th:if="${#fields.hasErrors('username')}"
               th:errors="*{username}"></p>
        </div>

        <div>
            <label>이름</label>
            <input type="text"
                   th:field="*{name}"
                   required>
            <p th:if="${#fields.hasErrors('name')}"
               th:errors="*{name}"></p>
        </div>

        <div>
            <label>이메일</label>
            <input type="email"
                   th:field="*{email}"
                   required>
            <p th:if="${#fields.hasErrors('email')}"
               th:errors="*{email}"></p>
        </div>

        <div>
            <label>비밀번호</label>
            <input type="password"
                   th:field="*{password}"
                   required>
            <p th:if="${#fields.hasErrors('password')}"
               th:errors="*{password}"></p>
        </div>

        <div>
            <label>비밀번호 확인</label>
            <input type="password"
                   th:field="*{passwordConfirm}"
                   required>
        </div>

        <p th:if="${#fields.hasGlobalErrors()}"
           th:each="err : ${#fields.globalErrors()}"
           th:text="${err}"></p>

        <button type="submit">회원가입</button>

    </form>

    <p>
        이미 계정이 있으신가요?
        <a th:href="@{/login}">로그인</a>
    </p>

</body>
</html>
