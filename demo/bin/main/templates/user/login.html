
<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <title>로그인</title>
</head>

<body>

    <h2>로그인</h2>

    <p th:if="${param.error}" style="color:red;">
        아이디 또는 비밀번호를 확인해주세요.
    </p>

    <p th:if="${param.logout}">
        로그아웃되었습니다.
    </p>

    <p th:if="${param.registered}">
        회원가입이 완료되었습니다. 로그인해주세요.
    </p>

    <p th:if="${param.passwordChanged}">
        비밀번호가 변경되었습니다. 다시 로그인해주세요.
    </p>

    <p th:if="${param.withdrawn}">
        회원탈퇴가 완료되었습니다.
    </p>

    <form th:action="@{/login}" method="post">

        <div>
            <label for="username">아이디</label>
            <input type="text"
                   id="username"
                   name="username"
                   autocomplete="username"
                   required>
        </div>

        <div>
            <label for="password">비밀번호</label>
            <input type="password"
                   id="password"
                   name="password"
                   autocomplete="current-password"
                   required>
        </div>

        <button type="submit">로그인</button>

    </form>

    <hr>

    <p>아직 계정이 없으신가요?</p>

    <a th:href="@{/user/signup}">
        회원가입
    </a>

</body>
</html>
