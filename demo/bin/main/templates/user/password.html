
<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>비밀번호 변경</title>
</head>

<body>

<h2>비밀번호 변경</h2>

<form th:action="@{/user/password}"
      th:object="${passwordChangeRequest}"
      method="post">

    <div>
        <label>현재 비밀번호</label>
        <input type="password"
               th:field="*{currentPassword}"
               required>
    </div>

    <div>
        <label>새 비밀번호</label>
        <input type="password"
               th:field="*{newPassword}"
               minlength="8"
               required>
    </div>

    <div>
        <label>새 비밀번호 확인</label>
        <input type="password"
               th:field="*{confirmPassword}"
               required>
    </div>

    <div th:if="${#fields.hasAnyErrors()}">
        <p th:each="err : ${#fields.allErrors()}"
           th:text="${err}"></p>
    </div>

    <button type="submit">비밀번호 변경</button>

</form>

<p>
    <a th:href="@{/user/profile}">프로필로 돌아가기</a>
</p>

</body>
</html>
