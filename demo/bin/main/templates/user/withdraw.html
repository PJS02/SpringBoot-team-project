<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>회원탈퇴</title>
</head>

<body>

<h2>회원탈퇴</h2>

<p>
    탈퇴하면 계정이 비활성화되며
    다시 로그인할 수 없습니다.
</p>

<form th:action="@{/user/withdraw}"
      th:object="${withdrawRequest}"
      method="post">

    <div>
        <label>현재 비밀번호</label>
        <input type="password"
               th:field="*{password}"
               required>
    </div>

    <div th:if="${#fields.hasAnyErrors()}">
        <p th:each="err : ${#fields.allErrors()}"
           th:text="${err}"></p>
    </div>

    <button type="submit"
            onclick="return confirm('정말 탈퇴하시겠습니까?');">
        회원탈퇴
    </button>

</form>

<p>
    <a th:href="@{/user/profile}">
        취소
    </a>
</p>

</body>
</html>
